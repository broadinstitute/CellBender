name: docs-build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install docs dependencies
        run: pip install -r requirements-rtd.txt

      - name: Build docs
        run: make docs
