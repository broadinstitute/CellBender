name: Benchmark CellBender

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or SHA to benchmark"
        required: false
        default: "main"
      run_note:
        description: "Optional label for the artifact (e.g. 'v0.3.3 release')"
        required: false
      machine_type:
        description: "GCP machine type (default: n1-highmem-8 = 8 vCPU / 52 GB RAM). Also try: n1-highmem-16."
        required: false
        default: "n1-highmem-8"
      gpu_type:
        description: "GCP GPU type (default: nvidia-tesla-t4). Also try: nvidia-tesla-k80."
        required: false
        default: "nvidia-tesla-t4"
      cpu_count:
        description: "CPU count hint — used only when machine_type is cleared (leave blank to use machine_type)."
        required: false
      memory_gb:
        description: "Memory in GB hint — used only when machine_type is cleared (leave blank to use machine_type)."
        required: false
      boot_disk_gb:
        description: "Boot disk size in GB (default: 100). Increase for large datasets with heavy temp spill."
        required: false
        default: "100"

jobs:
  run-cellbender:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write  # required for Workload Identity Federation
    outputs:
      sha-short: ${{ steps.sha.outputs.short }}
      sha-full: ${{ steps.sha.outputs.full }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Resolve git SHA
        id: sha
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.BENCHMARK_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ".github/workflows/benchmark.yml"

      - name: Install Python dependencies
        run: pip install --quiet google-cloud-batch

      - name: Submit benchmark jobs and wait for completion
        # Submits 5 Google Batch GPU jobs in parallel, polls until all succeed,
        # then writes benchmarking/outputs.json with {sample: gcs_output_dir}.
        # The full git SHA is passed so the Batch job can clone the exact commit.
        # cpu_count/memory_gb are only forwarded when machine_type is cleared.
        run: |
          EXTRA_HW_ARGS=""
          if [[ -z "${{ inputs.machine_type }}" ]]; then
            [[ -n "${{ inputs.cpu_count }}" ]] && EXTRA_HW_ARGS="$EXTRA_HW_ARGS --cpu-count ${{ inputs.cpu_count }}"
            [[ -n "${{ inputs.memory_gb }}" ]] && EXTRA_HW_ARGS="$EXTRA_HW_ARGS --memory-gb ${{ inputs.memory_gb }}"
          fi
          python benchmarking/submit_benchmarks.py \
            --git-hash "${{ steps.sha.outputs.full }}" \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --machine-type "${{ inputs.machine_type }}" \
            --gpu-type "${{ inputs.gpu_type }}" \
            --boot-disk-gb "${{ inputs.boot_disk_gb }}" \
            $EXTRA_HW_ARGS \
            --outputs-file benchmarking/outputs.json

      - name: Upload outputs.json
        uses: actions/upload-artifact@v4
        with:
          name: outputs-json-${{ steps.sha.outputs.short }}
          path: benchmarking/outputs.json
          retention-days: 90

  run-notebook:
    needs: run-cellbender
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # required for GCS access during notebook execution

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.BENCHMARK_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ".github/workflows/benchmark.yml"

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            papermill \
            ipykernel \
            scanpy[leiden] \
            colorcet \
            seaborn \
            scikit-misc
          pip install --quiet .

      - name: Download outputs.json
        uses: actions/download-artifact@v4
        with:
          name: outputs-json-${{ needs.run-cellbender.outputs.sha-short }}
          path: benchmarking/

      - name: Execute benchmarking notebook
        # Papermill injects git_commit, outputs_json, and figure_dir into the
        # parameters cell. Figures saved via savefig() land in benchmarking/figures/.
        run: |
          python benchmarking/run_notebook.py \
            --git-commit "${{ needs.run-cellbender.outputs.sha-short }}" \
            --outputs-file benchmarking/outputs.json \
            --input-notebook benchmarking/cellbender_benchmarking.ipynb \
            --output-notebook benchmarking/cellbender_benchmarking_executed.ipynb \
            --figure-dir benchmarking/figures

      - name: Upload benchmark notebook
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ needs.run-cellbender.outputs.sha-short }}${{ inputs.run_note != '' && format('-{0}', inputs.run_note) || '' }}
          path: benchmarking/cellbender_benchmarking_executed.ipynb
          retention-days: 90

      - name: Upload benchmark figures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-figures-${{ needs.run-cellbender.outputs.sha-short }}${{ inputs.run_note != '' && format('-{0}', inputs.run_note) || '' }}
          path: benchmarking/figures/
          retention-days: 90
